<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Вася против ИИ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#7ec8ff;font-family:ui-rounded,system-ui,sans-serif;overflow:hidden;user-select:none;touch-action:none}
#c{display:block;width:100%;height:100%;position:fixed;inset:0}
#ui{position:fixed;inset:0;pointer-events:none;z-index:2}
#hud{display:flex;justify-content:space-between;align-items:flex-start;padding:max(8px,env(safe-area-inset-top)) 10px 0;gap:6px}
.pill{pointer-events:auto;background:#fff;border:3px solid #1a1a2e;border-radius:16px;padding:5px 10px;font-weight:800;color:#1a1a2e;font-size:14px;box-shadow:0 2px 0 #1a1a2e}
#mut{width:40px;height:40px;border-radius:50%;padding:0;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer}
#enbar{position:absolute;left:10px;right:10px;top:52px;height:20px;background:#fff;border:3px solid #1a1a2e;border-radius:12px;overflow:hidden;box-shadow:0 2px 0 #1a1a2e}
#enfill{display:block;height:100%;width:100%;background:linear-gradient(90deg,#6edc6e,#ffd54a 70%,#ff8a3d);border-radius:8px}
#enbar.low #enfill{background:linear-gradient(90deg,#ffd54a,#ff5d5d)}
#enbar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;color:#1a1a2e;letter-spacing:.2px}
#combo{position:absolute;left:50%;top:78px;transform:translateX(-50%);font-weight:900;font-size:28px;color:#ff2d55;text-shadow:2px 2px 0 #fff,-1px 0 #1a1a2e,1px 0 #1a1a2e,0 1px #1a1a2e,0 -1px #1a1a2e;opacity:0;transition:opacity .15s}
#combo.show{opacity:1}
#btn{pointer-events:auto;position:absolute;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));border:3px solid #1a1a2e;background:#ff2d55;color:#fff;font-weight:900;font-size:22px;letter-spacing:1px;border-radius:18px;padding:12px;box-shadow:0 5px 0 #1a1a2e;font-family:inherit;cursor:pointer}
#btn:active{transform:translateY(3px);box-shadow:0 2px 0 #1a1a2e}
#btn.tired{background:#9aa3b2}
.ov{position:absolute;inset:0;background:#7ec8ffee;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;color:#1a1a2e;pointer-events:auto}
.ov.hid{display:none}
.ov h1,.ov h2{font-size:30px;margin:8px 0;text-shadow:2px 2px 0 #fff}
.ov p{font-weight:700;max-width:320px;margin:6px 0 16px;font-size:15px;line-height:1.4;white-space:pre-line}
.ov button{border:3px solid #1a1a2e;background:#ffd400;color:#1a1a2e;font-weight:900;font-size:18px;border-radius:16px;padding:12px 24px;cursor:pointer;box-shadow:0 4px 0 #1a1a2e;font-family:inherit}
#say{position:absolute;left:8%;right:8%;top:112px;background:#fff;border:3px solid #1a1a2e;border-radius:16px;padding:8px 12px;font-weight:800;font-size:14px;color:#1a1a2e;text-align:center;opacity:0;pointer-events:none;box-shadow:0 3px 0 #1a1a2e}
#say.on{opacity:1}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="hud">
    <div class="pill">Очки <b id="sc">0</b></div>
    <div class="pill">Ур. <b id="lv">1</b></div>
    <div class="pill" id="hp">❤️❤️❤️</div>
    <button class="pill" id="mut" type="button" aria-label="Звук">🔊</button>
  </div>
  <div id="enbar"><i id="enfill"></i><span>☕ энергия</span></div>
  <div id="combo"></div>
  <div id="say"></div>
  <button id="btn" type="button">БДЫЩ!</button>
  <div id="menu" class="ov">
    <div style="font-size:48px">📷</div>
    <h1>Вася против ИИ</h1>
    <p>Вася — фотограф, а днём воюет с Excel и мечтает о диване. Роботы лезут мешать. Жми «БДЫЩ!», только когда бот рядом — он засветится. Каждый удар тратит энергию, без тапов она копится. Зевать нельзя: бот зайдёт за спину и сделает массаж.</p>
    <button id="go" type="button">Погнали!</button>
  </div>
  <div id="over" class="ov hid">
    <h2>Вася выдохся!</h2>
    <p id="res"></p>
    <button id="again" type="button">Ещё раз</button>
  </div>
</div>
<script>
(function(){
const E=[
  {n:'Клод',c:'#e89a5e',c2:'#c4743a',a:'Я только хотел уточнить…',h:'Ну ладно, подумаем ещё'},
  {n:'Гемини',c:'#8b7cff',c2:'#5d4ed6',a:'Сначала план на 12 слайдов!',h:'Подождите, я ещё гуглю…'},
  {n:'ChatGPT',c:'#2dcea0',c2:'#1a9a76',a:'Как эксперт с 20-летним стажем…',h:'Конечно! Вот 7 пунктов…'},
  {n:'Copilot',c:'#4d8ef7',c2:'#2d63c4',a:'Я уже набросал PR!',h:'Давай закоммитим и посмотрим'},
  {n:'Алиса',c:'#ffd56a',c2:'#e0a82e',a:'Я — Алиса, приятно познакомиться!',h:'Включила бы плейлист, но тут съёмка'},
  {n:'ГигаЧат',c:'#3dd68c',c2:'#1fa862',a:'По регламенту положено…',h:'Перевожу на оператора'},
  {n:'DeepSeek',c:'#2aa8ff',c2:'#1578c4',a:'Thinking… 47 секунд',h:'Вывод: ой'}
];
const V=['ВПР не трожь!','у меня сводная не сведена!','не в кадр!','хочу на диван','это не в той ячейке!','визуал потом, сначала таблица!'];
const MMM=['ммм~','ох, хорошо...','ещё чуть-чуть...','спинка довольна','ой, приятно~','как на диване…'];
const EMAX=100, HIT_COST=12, WHIFF_COST=6, MIN_HIT=8, REGEN=17, REGEN_DELAY=.45;
const VASYA_W=80, REACH=VASYA_W*1.5;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const $ = id => document.getElementById(id);
const tg = window.Telegram && Telegram.WebApp;
const jsErrors=[];
window.addEventListener('error', ev => jsErrors.push(String(ev.message||ev)));
window.addEventListener('unhandledrejection', ev => jsErrors.push(String(ev.reason||ev)));

let W=390,H=844,dpr=1, score=0, best=0, lives=3, level=1, combo=0, comboT=0;
let running=false, over=false, muted=false, last=0, spawn=0, sayT=0;
let energy=EMAX, elapsed=0, lastSpend=0, tiredSay=0;
let enemies=[], parts=[], floats=[], puffs=[], relax=0, purrT=0, blissSay=0, relaxKO=false;
let vasya={x:195,y:700,swing:0,face:0,bob:0,hit:0,bliss:0,startle:0,flash:0,tired:0};
let ac=null;

try{ muted=localStorage.getItem('vasyaMute')==='1'; best=+localStorage.getItem('vasyaBest')||0; }catch(e){}
$('mut').textContent=muted?'🔇':'🔊';

if(tg){
  try{ tg.ready(); tg.expand(); if(tg.disableVerticalSwipes) tg.disableVerticalSwipes(); }catch(e){}
  try{
    if(tg.CloudStorage && tg.CloudStorage.getItem){
      tg.CloudStorage.getItem('vasyaBest', (err,v)=>{ if(!err && v && +v>best){ best=+v; } });
    }
  }catch(e){}
}

function saveBest(){
  if(score>best) best=score;
  try{ localStorage.setItem('vasyaBest', String(best)); }catch(e){}
  try{ if(tg && tg.CloudStorage && tg.CloudStorage.setItem) tg.CloudStorage.setItem('vasyaBest', String(best)); }catch(e){}
}
function hap(kind){
  const Hf=tg && tg.HapticFeedback; if(!Hf) return;
  try{
    if(kind==='hit') Hf.impactOccurred('heavy');
    else if(kind==='hurt') Hf.notificationOccurred('error');
    else if(kind==='ok') Hf.notificationOccurred('success');
    else Hf.impactOccurred('light');
  }catch(e){}
}
function audio(){
  const C=window.AudioContext||window.webkitAudioContext; if(!C) return null;
  if(!ac) ac=new C();
  if(ac.state==='suspended') ac.resume();
  return ac;
}
function tone(freq,dur,type,vol,slide){
  if(muted) return;
  const c=audio(); if(!c) return;
  const o=c.createOscillator(), g=c.createGain();
  o.type=type||'square';
  o.frequency.setValueAtTime(freq,c.currentTime);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(1,slide),c.currentTime+dur);
  g.gain.setValueAtTime(vol||.14,c.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dur);
  o.connect(g); g.connect(c.destination);
  o.start(); o.stop(c.currentTime+dur+.02);
}
function snd(kind){
  if(kind==='bonk'){ tone(140,.12,'square',.2,60); setTimeout(()=>tone(420,.06,'square',.12),40); setTimeout(()=>tone(180,.08,'triangle',.1,80),70); hap('hit'); }
  else if(kind==='flash'){ tone(980,.05,'square',.1); setTimeout(()=>tone(1400,.04,'sine',.08),30); }
  else if(kind==='robot'){ tone(880,.05,'square',.08); setTimeout(()=>tone(660,.05,'square',.08),50); setTimeout(()=>tone(990,.07,'square',.07),100); }
  else if(kind==='boing'){ tone(200,.28,'sine',.16,520); hap('hurt'); }
  else if(kind==='whiff'){ tone(260,.1,'triangle',.1,140); hap('light'); }
  else if(kind==='tired'){ tone(180,.2,'sine',.1,90); setTimeout(()=>tone(140,.25,'sine',.08,70),180); hap('hurt'); }
  else if(kind==='laugh'){ [520,620,720,640].forEach((f,i)=>setTimeout(()=>tone(f,.07,'triangle',.12),i*70)); hap('ok'); }
  else if(kind==='wah'){ [400,340,280,220,180,140].forEach((f,i)=>setTimeout(()=>tone(f,.18,'sawtooth',.1,f*.7),i*160)); hap('hurt'); }
  else if(kind==='purr'){
    [160,190,150,180,140].forEach((f,i)=>setTimeout(()=>tone(f,.22,'sine',.07,f+30),i*120));
    setTimeout(()=>tone(90,.4,'triangle',.05,130),200);
    hap('ok');
  }
}
function say(t){ $('say').textContent=t; $('say').classList.add('on'); clearTimeout(sayT); sayT=setTimeout(()=>$('say').classList.remove('on'),1400); }
function hearts(){ $('hp').textContent='❤️'.repeat(Math.max(0,lives))+'🤍'.repeat(Math.max(0,3-lives)); }
function ui(){
  $('sc').textContent=score; $('lv').textContent=level; hearts();
  const pct=Math.max(0,Math.min(100,energy));
  $('enfill').style.width=pct+'%';
  $('enbar').classList.toggle('low', energy<28);
  $('btn').classList.toggle('tired', energy<MIN_HIT);
}
function inRange(en){
  if(!en||en.dead) return false;
  if(en.phase) return true;
  return Math.hypot(en.x-vasya.x, en.y-vasya.y) <= REACH + (en.r||36)*.25;
}
function spend(cost){
  energy=Math.max(0, energy-cost);
  lastSpend=elapsed;
  ui();
}
function canHit(){ return energy>=MIN_HIT; }

function resize(){
  const vv = window.visualViewport;
  W = Math.round((vv && vv.width) || window.innerWidth);
  H = Math.round((tg && tg.viewportStableHeight) || (vv && vv.height) || window.innerHeight);
  dpr = Math.min(2.5, window.devicePixelRatio||1);
  cv.width = Math.max(1, W*dpr);
  cv.height = Math.max(1, H*dpr);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  vasya.x = W/2;
  vasya.y = H - 168;
}
resize();
window.addEventListener('resize', resize);
if(tg && tg.onEvent) tg.onEvent('viewportChanged', resize);

function spawnEnemy(){
  const k=E[Math.floor(Math.random()*E.length)];
  const side=Math.floor(Math.random()*3);
  let x,y;
  const spd=70+elapsed*0.38+Math.random()*16;
  if(side===0){ x=40+Math.random()*(W-80); y=-40; }
  else if(side===1){ x=-50; y=40+Math.random()*(H*0.45); }
  else { x=W+50; y=40+Math.random()*(H*0.45); }
  const dx=vasya.x-x, dy=vasya.y-40-y, len=Math.hypot(dx,dy)||1;
  enemies.push({k,x,y,vx:dx/len*spd,vy:dy/len*spd,r:34,rot:0,dead:false,hitT:0,s:1,phase:'',sneak:0,rub:0,side:1,ox:x,oy:y});
  snd('robot');
}

function massaging(){ return enemies.some(e=>!e.dead && (e.phase==='rub'||e.phase==='sneak')); }
function rubbing(){ return enemies.some(e=>!e.dead && e.phase==='rub'); }
function startMassage(en){
  if(!en||en.dead||en.phase) return;
  en.phase='sneak'; en.sneak=0; en.rub=0;
  en.side = (en.x < vasya.x) ? -1 : 1;
  en.ox=en.x; en.oy=en.y;
  snd('purr'); purrT=performance.now();
  say(en.k.n+' подкрался сзади…  — Вася: «ммм~»');
}
function spawnPuff(){
  const kind=Math.random()<.65?'heart':'steam';
  puffs.push({x:vasya.x+(Math.random()*50-25), y:vasya.y-50-Math.random()*20, t:0, kind, s:.7+Math.random()*.5});
}
function burst(x,y,col,txt){
  for(let i=0;i<12;i++){
    const a=Math.random()*Math.PI*2, sp=80+Math.random()*160;
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:.45,c:col||'#ff2d55'});
  }
  floats.push({x,y,t:0,txt:txt||'БДЫЩ!', vy:-80});
}
function swat(en){
  if(!running||!en||en.dead) return false;
  if(!canHit()){ tiredFail(); return false; }
  if(!inRange(en)){ whiff(); return false; }
  spend(HIT_COST);
  en.dead=true; en.hitT=1;
  const now=performance.now();
  combo = (now-comboT<1200) ? combo+1 : 1;
  comboT=now;
  const add=1+Math.max(0,combo-1);
  score+=add;
  ui();
  vasya.swing=1; vasya.face=en.x; vasya.hit=.25; vasya.flash=.22;
  burst(en.x,en.y,en.k.c,'БДЫЩ!');
  snd('bonk'); snd('flash');
  if(combo>=3){ $('combo').textContent='КОМБО x'+combo+'!'; $('combo').classList.add('show'); snd('laugh'); }
  else $('combo').classList.remove('show');
  const wasRub=!!en.phase;
  en.phase='';
  if(wasRub){
    vasya.bliss=0; vasya.startle=.55;
    say('А?! Ты чё!  — Вася вскинул камеру.');
  } else {
    say(en.k.h+'  — Вася: «'+V[score%V.length]+'»');
  }
  return true;
}
function tiredFail(){
  vasya.swing=.35; vasya.tired=.5;
  snd('tired');
  if(elapsed-tiredSay>1.1){ tiredSay=elapsed; say('всё, я выдохся… дайте глоток кофе'); }
}
function whiff(){
  if(!canHit()){ tiredFail(); return; }
  spend(WHIFF_COST);
  vasya.swing=.55;
  snd('whiff');
  floats.push({x:vasya.x+30,y:vasya.y-70,t:0,txt:'мимо!', vy:-70});
  say('мимо! Подожди, пока бот подойдёт ближе.');
}
function smashNearest(){
  if(!running) return;
  let t=null, bestD=1e9, bestPri=0;
  for(const en of enemies){
    if(en.dead || !inRange(en)) continue;
    const pri=en.phase?2:1;
    const d=Math.hypot(en.x-vasya.x, en.y-vasya.y);
    if(pri>bestPri || (pri===bestPri && d<bestD)){ bestD=d; bestPri=pri; t=en; }
  }
  if(t) swat(t);
  else whiff();
}
function gameOver(){
  running=false; over=true; saveBest(); snd('wah');
  let line='Вася закрыл ноут и ушёл на диван. ИИ подождут.';
  if(relaxKO) line='Вася расслабился от массажа и уснул прямо на сводной.';
  else if(energy<MIN_HIT) line='Энергия на нуле. Сводная так и не свелась.';
  $('res').textContent='Очки: '+score+'  •  Рекорд: '+best+'\n'+line;
  $('over').classList.remove('hid');
}
function start(){
  $('menu').classList.add('hid'); $('over').classList.add('hid');
  enemies=[]; parts=[]; floats=[]; puffs=[]; score=0; lives=3; level=1; combo=0; over=false; running=true;
  energy=EMAX; elapsed=0; lastSpend=0; tiredSay=0;
  relax=0; relaxKO=false; purrT=0; blissSay=0; vasya.bliss=0; vasya.startle=0; vasya.swing=0; vasya.flash=0; vasya.tired=0;
  ui(); audio(); snd('robot'); last=performance.now(); spawn=0;
  loop(last);
}
function hitTest(x,y){
  const nearVasya=Math.hypot(x-vasya.x,y-vasya.y)<70;
  for(let i=enemies.length-1;i>=0;i--){
    const en=enemies[i]; if(en.dead) continue;
    if(en.phase && nearVasya) return en;
    if(Math.hypot(en.x-x,en.y-y)<en.r+14) return en;
  }
  return null;
}

function step(dt, now){
  elapsed+=dt;
  spawn+=dt;
  level=Math.min(10, 1+Math.floor(elapsed/20));
  if(elapsed-lastSpend>=REGEN_DELAY) energy=Math.min(EMAX, energy+REGEN*dt);
  ui();
  const gap=Math.max(.38, 1.28 - elapsed*0.0055);
  const cap=3+Math.min(4, Math.floor(elapsed/30));
  const alive=enemies.filter(e=>!e.dead).length;
  if(spawn>gap && alive<cap){ spawn=0; spawnEnemy(); }
  vasya.bob+=dt;
  if(vasya.swing>0) vasya.swing=Math.max(0,vasya.swing-dt*4);
  if(vasya.hit>0) vasya.hit=Math.max(0,vasya.hit-dt);
  if(vasya.startle>0) vasya.startle=Math.max(0,vasya.startle-dt);
  if(vasya.flash>0) vasya.flash=Math.max(0,vasya.flash-dt*4);
  if(vasya.tired>0) vasya.tired=Math.max(0,vasya.tired-dt);
  if(now-comboT>1200) $('combo').classList.remove('show');
  const floor=vasya.y-20;
  for(const en of enemies){
    if(en.dead){
      en.hitT-=dt*2; en.x+=en.vx*dt*1.4; en.y-=180*dt; en.rot+=720*dt; en.s=Math.max(.1,en.s-dt*1.6);
      continue;
    }
    if(en.phase==='sneak'){
      en.sneak=Math.min(1, en.sneak+dt*1.8);
      const u=en.sneak, tx=vasya.x+en.side*24, ty=vasya.y+6;
      const cx=(en.ox+tx)/2 + en.side*80, cy=(en.oy+ty)/2 - 20;
      const iu=1-u;
      en.x=iu*iu*en.ox + 2*iu*u*cx + u*u*tx;
      en.y=iu*iu*en.oy + 2*iu*u*cy + u*u*ty;
      en.rot=Math.sin(u*12)*10;
      if(u>=1){ en.phase='rub'; en.rub=0; say('Вася: «'+MMM[Math.floor(Math.random()*MMM.length)]+'»'); }
    } else if(en.phase==='rub'){
      en.rub+=dt;
      en.x=vasya.x+en.side*24 + Math.sin(en.rub*10)*2;
      en.y=vasya.y+6 + Math.sin(en.rub*8)*2;
      en.rot=Math.sin(en.rub*12)*8;
    } else {
      en.x+=en.vx*dt; en.y+=en.vy*dt; en.rot=Math.sin(now/200+en.x)*8;
      const d=Math.hypot(en.x-vasya.x, en.y-(vasya.y-10));
      if(en.y>floor || d<62) startMassage(en);
    }
  }
  vasya.bliss = rubbing() ? 1 : 0;
  if(rubbing()){
    relax=Math.min(1, relax+dt/2.6);
    if(now-purrT>800){ snd('purr'); purrT=now; }
    if(now-blissSay>1800){ blissSay=now; say('Вася: «'+MMM[Math.floor(Math.random()*MMM.length)]+'»'); }
    if(Math.random()<dt*5) spawnPuff();
    if(relax>=1){
      relax=0; lives--; ui(); hap('hurt');
      if(lives<=0){ relaxKO=true; gameOver(); }
      else say('Вася совсем расслабился… ещё чуть-чуть — и уснёт!');
    }
  } else {
    relax=Math.max(0, relax-dt*0.18);
  }
  enemies=enemies.filter(e=>!e.dead || e.hitT>0);
  for(const p of parts){ p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=240*dt; }
  parts=parts.filter(p=>p.life>0);
  for(const f of floats){ f.t+=dt; f.y+=f.vy*dt; }
  floats=floats.filter(f=>f.t<.7);
  for(const u of puffs){ u.t+=dt; u.y-=40*dt; u.x+=Math.sin(u.t*6)*12*dt; }
  puffs=puffs.filter(u=>u.t<1.2);
}
function loop(now){
  if(!running) return;
  const dt=Math.min(32, now-last)/1000; last=now;
  step(dt, now);
  draw();
  requestAnimationFrame(loop);
}

  cv.width=W*dpr; cv.height=H*dpr; cv.style.width='640px'; cv.style.height='360px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  vasya.x=490; vasya.y=230; vasya.swing=.45; vasya.flash=.2; vasya.face=400;
  enemies=[
    {k:E[2],x:400,y:118,vx:0,vy:0,r:34,rot:-10,dead:false,hitT:0,s:1.0,phase:'',sneak:0,rub:0,side:-1,ox:0,oy:0},
    {k:E[0],x:575,y:108,vx:0,vy:0,r:34,rot:8,dead:false,hitT:0,s:.95,phase:'',sneak:0,rub:0,side:1,ox:0,oy:0},
    {k:E[6],x:490,y:72,vx:0,vy:0,r:34,rot:0,dead:false,hitT:0,s:.85,phase:'',sneak:0,rub:0,side:1,ox:0,oy:0}
  ];
  draw();
  ctx.fillStyle='#fff'; ctx.strokeStyle='#1a1a2e'; ctx.lineWidth=5;
  roundRect(22,22,300,316,24); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#1a1a2e'; ctx.textAlign='left'; ctx.font='900 32px ui-rounded,system-ui,sans-serif';
  ctx.fillText('Вася против ИИ', 42, 74);
  ctx.font='700 18px ui-rounded,system-ui,sans-serif';
  ctx.fillText('Фотограф. Excel. Диван.', 42, 114);
  ctx.font='700 16px ui-rounded,system-ui,sans-serif';
  ctx.fillText('Бей, только когда бот', 42, 160);
  ctx.fillText('подошёл близко.', 42, 184);
  fillRound(42,230,150,48,16,'#ff2d55'); strokeRound(42,230,150,48,16,'#1a1a2e',4);
  ctx.fillStyle='#fff'; ctx.font='900 22px ui-rounded,system-ui,sans-serif'; ctx.textAlign='center';
  ctx.fillText('БДЫЩ!', 117, 261);
}

window.__vasya={
  get score(){return score}, get lives(){return lives}, get level(){return level},
  get running(){return running}, get over(){return over}, get errors(){return jsErrors.slice()},
  get relax(){return relax}, get massaging(){return massaging()}, get rubbing(){return rubbing()},
  get energy(){return energy}, get elapsed(){return elapsed}, get reach(){return REACH},
  start, smash:smashNearest, spawn:spawnEnemy, startMassage, inRange, canHit, spend,
  setEnergy(v){ energy=Math.max(0,Math.min(EMAX,v)); ui(); },
  setElapsed(v){ elapsed=Math.max(0,v); },
  massageNow(){
    if(!running) start();
    let e=enemies.find(en=>!en.dead && !en.phase);
    if(!e){ spawnEnemy(); e=enemies[enemies.length-1]; }
    e.x=vasya.x-40; e.y=vasya.y-40; startMassage(e); e.phase='rub'; e.sneak=1; e.rub=.3;
    e.x=vasya.x+e.side*24; e.y=vasya.y+6;
    relax=Math.max(relax,.4);
    say('Вася: «ммм~»');
  },
  placeClose(){
    if(!running) start();
    const e={k:E[2],x:vasya.x-30,y:vasya.y-80,vx:0,vy:0,r:34,rot:0,dead:false,hitT:0,s:1,phase:'',sneak:0,rub:0,side:-1,ox:0,oy:0};
    enemies.push(e); return {x:e.x,y:e.y,n:e.k.n,inRange:inRange(e)};
  },
  placeFar(){
    if(!running) start();
    const e={k:E[0],x:80,y:80,vx:0,vy:0,r:34,rot:0,dead:false,hitT:0,s:1,phase:'',sneak:0,rub:0,side:-1,ox:0,oy:0};
    enemies.push(e); return {x:e.x,y:e.y,n:e.k.n,inRange:inRange(e)};
  },
  sim(seconds){
    if(!running) start();
    const steps=Math.max(1,Math.ceil(seconds/0.05));
    for(let i=0;i<steps;i++){ last+=50; step(0.05, last); if(!running) break; }
    draw();
    return {over, elapsed, energy, lives, score, errors:jsErrors.slice()};
  },
  tap(x,y){ const en=hitTest(x,y); if(en) return swat(en); smashNearest(); return false; },
  forceOver:gameOver,
  enemyAt(i){ const e=enemies[i]; return e&&!e.dead? {x:e.x,y:e.y,n:e.k.n,phase:e.phase||'',inRange:inRange(e)}:null; },
  enemies(){ return enemies.filter(e=>!e.dead).map(e=>({x:e.x,y:e.y,n:e.k.n,phase:e.phase||'',inRange:inRange(e)})); }
};
})();
